<!-- main container -->
<div class="layout-row-wrap align-center-start">
  <div class="flex-gt-sm-55 flex-full">
    <br /><br />
    <!-- begin card container -->
    <mat-card
      class="card-container mat-elevation-z4"
      style="margin-bottom: 70px; background-color: #f2f2f2"
    >
      <mat-card-title>
        <h1 class="title" style="text-align: center">
          Forgot Password <br />
          <h4 style="text-align: center">
            <span class="subtitle">
              Fields marked with an asterisk (*) are required.
            </span>
          </h4>
        </h1>
      </mat-card-title>

      <br /><br />

      <app-messages
        [(value)]="errorMessages"
        [enableService]="false"
      ></app-messages>

      <form [formGroup]="form" (ngSubmit)="verifyUser()" #usernameFrom>
        <mat-card-content class="layout-column">
          <mat-form-field appearance="fill" class="flex-grow">
            <mat-label>Username</mat-label>
            <input matInput required formControlName="username" />

            <mat-error
              class="error"
              *ngIf="
                form.controls['username'].hasError('required') &&
                form.controls['username'].touched
              "
            >
              Username is a required field.
            </mat-error>
          </mat-form-field>

          <br /><br />

          <div class="flex-grow align-end p5">
            <button
              mat-raised-button
              routerLink="/session/login"
              style="
                font-family: Lato;
                font-weight: bold;
              "
            >
              Cancel
            </button>
            &nbsp;&nbsp;
            <button
              mat-raised-button
              [disabled]="!form.valid"
              class="btn-primary"
              style="
                font-family: Lato;
                font-weight: bold;
              "
            >
              Forgot Password
            </button>
          </div>
        </mat-card-content>
      </form>
    </mat-card>
    <!-- end card container -->
  </div>
</div>
