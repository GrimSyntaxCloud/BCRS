<mat-card
  ><p class="eyebrow">DEMO CONFIGURATIONS</p>
  <h1>The people behind the profiles.</h1>
  <p>Read-only fictional sample users.</p>
  <p-table [value]="users" responsiveLayout="scroll"
    ><ng-template pTemplate="header"
      ><tr>
        <th>First name</th>
        <th>Last name</th>
        <th>Phone number</th>
        <th>Email</th>
        <th>Address</th>
        <th>Role</th>
      </tr></ng-template
    ><ng-template pTemplate="body" let-user
      ><tr>
        <td>{{ user.firstName }}</td>
        <td>{{ user.lastName }}</td>
        <td>{{ user.phoneNumber }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.address }}</td>
        <td>{{ user.role.text }}</td>
      </tr></ng-template
    ></p-table
  ></mat-card
>
