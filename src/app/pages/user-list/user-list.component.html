<mat-card
  ><p class="eyebrow">DEMO CONFIGURATIONS</p>
  <h1>The people behind the profiles.</h1>
  <p>Read-only fictional sample users.</p>
  <div class="demo-table-scroll" tabindex="0" role="region" aria-label="user list">
    <table class="demo-table">
      <thead><tr><th scope="col">First name</th><th scope="col">Last name</th><th scope="col">Phone number</th><th scope="col">Email</th><th scope="col">Address</th><th scope="col">Role</th></tr></thead>
      <tbody><tr *ngFor="let user of users"><td>{{ user.firstName }}</td><td>{{ user.lastName }}</td><td>{{ user.phoneNumber }}</td><td>{{ user.email }}</td><td>{{ user.address }}</td><td>{{ user.role?.text }}</td></tr></tbody>
    </table>
  </div>
</mat-card>
