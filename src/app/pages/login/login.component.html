<mat-card class="login-card">
  <mat-card-title>Try the BCRS demo</mat-card-title>
  <mat-card-content>
    <p>Explore a fictional computer repair shop as the demo administrator. Everyone shares the latest 50 sample invoices.</p>
    <p>This is a public demo, not a private account. No password, registration, real order, or payment is required.</p>
    <p-messages [(value)]="errorMessages" [enableService]="false"></p-messages>
    <button mat-raised-button class="btn-primary" (click)="login()">Open shared demo</button>
  </mat-card-content>
</mat-card>
