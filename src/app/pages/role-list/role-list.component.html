<mat-card
  ><p class="eyebrow">DEMO CONFIGURATIONS</p>
  <h1>Account roles.</h1>
  <p>Read-only fictional examples. No personal information is stored.</p>
  <p-table [value]="roles" responsiveLayout="scroll"
    ><ng-template pTemplate="header"
      ><tr>
        <th>Role</th>
      </tr></ng-template
    ><ng-template pTemplate="body" let-role
      ><tr>
        <td>{{ role.text }}</td>
      </tr></ng-template
    ></p-table
  ></mat-card
>
