<mat-card
  ><p class="eyebrow">DEMO CONFIGURATIONS</p>
  <h1>Account roles.</h1>
  <p>Read-only fictional examples. No personal information is stored.</p>
  <div class="demo-table-scroll" tabindex="0" role="region" aria-label="role list">
    <table class="demo-table">
      <thead><tr><th scope="col">Role</th></tr></thead>
      <tbody><tr *ngFor="let role of roles"><td>{{ role.text }}</td></tr></tbody>
    </table>
  </div>
</mat-card>
