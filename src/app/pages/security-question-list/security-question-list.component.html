<mat-card
  ><p class="eyebrow">DEMO CONFIGURATIONS</p>
  <h1>Security questions.</h1>
  <p>Read-only fictional examples. No personal information is stored.</p>
  <p-table [value]="securityQuestions" responsiveLayout="scroll"
    ><ng-template pTemplate="header"
      ><tr>
        <th>Question</th>
      </tr></ng-template
    ><ng-template pTemplate="body" let-sq
      ><tr>
        <td>{{ sq.text }}</td>
      </tr></ng-template
    ></p-table
  ></mat-card
>
