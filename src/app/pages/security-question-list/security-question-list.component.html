<mat-card
  ><p class="eyebrow">DEMO CONFIGURATIONS</p>
  <h1>Security questions.</h1>
  <p>Read-only fictional examples. No personal information is stored.</p>
  <div class="demo-table-scroll" tabindex="0" role="region" aria-label="security question list">
    <table class="demo-table">
      <thead><tr><th scope="col">Question</th></tr></thead>
      <tbody><tr *ngFor="let sq of securityQuestions"><td>{{ sq.text }}</td></tr></tbody>
    </table>
  </div>
</mat-card>
