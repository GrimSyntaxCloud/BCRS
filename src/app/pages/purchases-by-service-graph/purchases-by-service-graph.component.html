<mat-card style="
    width: 70%;
    margin-right: 15%;
    margin-left: 15%;
    margin-top: 30px;
    margin-bottom: 150px;
    background-color: #c0c0c0;
  ">
<div fxLayout="column" fxLayoutGap="20px">
  <h1>Purchases by Service</h1>
  <p>Counts come from the latest 50 invoices in your account (shared for guests). Select a chart label to hide or show a service.</p>
  <p-chart type="pie" [data]="data" style="display: block; width: 100%; max-width: 450px; margin: auto"></p-chart>
  <table aria-label="Sample service purchase counts">
    <thead><tr><th scope="col">Service</th><th scope="col">Count</th></tr></thead>
    <tbody><tr *ngFor="let purchase of purchases"><td>{{ purchase._id.title }}</td><td>{{ purchase.count }}</td></tr></tbody>
  </table>
</div>
</mat-card>
